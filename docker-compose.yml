# docker compose up --build
# First run only: docker compose exec ollama ollama pull qwen2.5:3b && docker compose exec ollama ollama pull qwen3:4b
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      COMEBLOG_OLLAMA_HOST: http://ollama:11434
      COMEBLOG_OLLAMA_MODEL: ${COMEBLOG_OLLAMA_MODEL:-qwen2.5:3b}
      COMEBLOG_EVALUATOR_MODEL: ${COMEBLOG_EVALUATOR_MODEL:-qwen3:4b}
      COMEBLOG_CONTACT: ${COMEBLOG_CONTACT:-}
      COMEBLOG_TAVILY_API_KEY: ${COMEBLOG_TAVILY_API_KEY:-}
      COMEBLOG_API_KEY: ${COMEBLOG_API_KEY:-}
      COMEBLOG_BASE_URL: ${COMEBLOG_BASE_URL:-http://localhost:8000}
    volumes:
      - output:/data/output
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy

  ui:
    build: ./ui
    environment:
      COMEBLOG_API_BASE: http://api:8000
      COMEBLOG_API_KEY: ${COMEBLOG_API_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  ollama:
  output:
